name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    name: Validate registry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build registry sources
        run: npm run registry:build --workspace web

      - name: Assert generated JSONs exist
        run: |
          set -euo pipefail
          test -f apps/web/public/r/registry.json
          test -f apps/web/public/r/ds-button.json
          test -f apps/web/public/r/ds-icon-button.json
          test -f apps/web/public/r/ds-colored-badge.json

      - name: Registry validate (shadcn CLI)
        # Default to main resolves against the upstream default branch, which
        # doesn't yet have registry.json. Pin the validate to the PR head ref
        # so it reads the registry.json on the branch under test. The shadcn
        # CLI accepts the `#ref` form for branch / tag / SHA.
        run: npx --yes shadcn@latest registry validate "deessejs/ui#${{ github.event.pull_request.head.ref || github.ref_name }}"
